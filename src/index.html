<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inference Gateway Desktop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="status-bar" role="status" aria-live="polite"></div>
    <div id="chat-transcript" role="log" aria-label="Chat transcript"></div>
    <div id="input-area">
      <select id="model-select" disabled>
        <option value="" disabled selected>Waiting for gateway...</option>
      </select>
      <button id="retry-btn" style="display:none">Retry</button>
      <textarea id="prompt-input" rows="3" placeholder="Type your message..." disabled></textarea>
      <button id="send-btn" disabled>Send</button>
    </div>
  </div>
  <script src="main.js"></script>
</body>
</html>
