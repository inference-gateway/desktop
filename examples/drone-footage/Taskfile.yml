version: '3'

vars:
  FILMCRAFT_VERSION: 0.19.0
  GYROFLOW_VERSION: 1.7.0
  ARCH:
    sh: uname -m | sed 's/arm64/aarch64/'
  FILMCRAFT_PACKAGE: filmcraft-{{.FILMCRAFT_VERSION}}-linux-{{.ARCH}}.deb
  FILMCRAFT_RELEASE: https://github.com/storytold/filmcraft/releases/download/v{{.FILMCRAFT_VERSION}}
  GYROFLOW_PACKAGE: '{{if eq .ARCH "aarch64"}}Gyroflow-linux-arm64.tar.gz{{else}}Gyroflow-linux64.tar.gz{{end}}'
  GYROFLOW_RELEASE: https://github.com/gyroflow/gyroflow/releases/download/v{{.GYROFLOW_VERSION}}
  LUT: dji-avata-2-dlog-m-to-rec709.cube
  LUT_URL: https://terra-1-g.djicdn.com/851d20f7b9f64838a34cd02351370894/avata2%20d-log/DJI%20Avata%202%20D-Log%20M%20to%20Rec.709%20V1._.cube
  LUT_SHA256: b18162854ab47702068410c33afa98a8cb6eef159fc5a04ce0e65fad0fd8947e
  TOOLS: '{{.HOME}}/drone-tools'
  INFER_DIR: '{{.HOME}}/.infer'
  WORKSPACE: ubuntu-desktop
  NODE: infer-k3s
  NODE_IP: 10.88.0.200
  COMPUTER: ghcr.io/inference-gateway/computer:latest
  GPU_IMAGE: ghcr.io/inference-gateway/computer:gpu

tasks:
  up:
    desc: Everything the app needs from outside it - FilmCraft, Gyroflow and DJI's LUT in a folder to share, and the drone-editor agent
    cmds:
      - mkdir -p {{.TOOLS}}
      - task: filmcraft
      - task: gyroflow
      - task: lut
      - task: agent:install

  filmcraft:
    desc: Download FilmCraft's Linux package for this computer's architecture, checked against the release's checksums
    dir: '{{.TOOLS}}'
    cmds:
      - curl -fsSLO {{.FILMCRAFT_RELEASE}}/{{.FILMCRAFT_PACKAGE}}
      - curl -fsSL {{.FILMCRAFT_RELEASE}}/SHA256SUMS.txt | grep ' {{.FILMCRAFT_PACKAGE}}$' | shasum -a 256 -c -
    status:
      - test -f {{.FILMCRAFT_PACKAGE}}

  gyroflow:
    desc: Gyroflow for Linux - downloaded on x86_64, built from source in Docker on arm64, which Gyroflow publishes no build for
    cmds:
      - task: 'gyroflow:{{if eq .ARCH "aarch64"}}build{{else}}download{{end}}'
    status:
      - test -f {{.TOOLS}}/{{.GYROFLOW_PACKAGE}}

  gyroflow:download:
    internal: true
    dir: '{{.TOOLS}}'
    cmds:
      - curl -fsSLO {{.GYROFLOW_RELEASE}}/{{.GYROFLOW_PACKAGE}}

  gyroflow:build:
    internal: true
    cmds:
      - docker build --build-arg VERSION={{.GYROFLOW_VERSION}} --output type=local,dest={{.TOOLS}} gyroflow

  lut:
    desc: Download DJI's D-Log M to Rec.709 LUT for the Avata 2, checked against the checksum of the file the example was run with
    dir: '{{.TOOLS}}'
    cmds:
      - curl -fsSL -o {{.LUT}} '{{.LUT_URL}}'
      - echo '{{.LUT_SHA256}}  {{.LUT}}' | shasum -a 256 -c -
    status:
      - test -f {{.LUT}}

  agent:install:
    desc: Copy the drone-editor agent into ~/.infer/agents, refusing to overwrite an agent of your own
    preconditions:
      - sh: '[ ! -e {{.INFER_DIR}}/agents/drone-editor.md ] || grep -q "^workspace: {{.WORKSPACE}}$" {{.INFER_DIR}}/agents/drone-editor.md'
        msg: ~/.infer/agents already holds a drone-editor agent of your own - move it aside first
    cmds:
      - mkdir -p {{.INFER_DIR}}/agents
      - cp agents/drone-editor.md {{.INFER_DIR}}/agents/drone-editor.md

  gpu:image:
    desc: Build the computer image with a Vulkan driver that reaches the Mac's GPU, and load it into the local cluster
    cmds:
      - podman build --build-arg COMPUTER={{.COMPUTER}} -t {{.GPU_IMAGE}} gpu
      - podman save {{.GPU_IMAGE}} | podman exec -i {{.NODE}} ctr -n k8s.io images import -

  gpu:node:
    desc: Hand the GPU's render device to every pod of the local cluster and pin the node's address, which restarts the node once
    vars:
      CONTAINERD: /var/lib/rancher/k3s/agent/etc/containerd
      DEVICE: '{"path":"/dev/dri/renderD128","type":"c","major":226,"minor":128,"fileMode":438,"uid":0,"gid":0}'
      ALLOW: '{"allow":true,"type":"c","major":226,"minor":128,"access":"rwm"}'
    cmds:
      - |
        podman exec {{.NODE}} ctr oci spec | python3 -c '
        import json, sys
        spec = json.load(sys.stdin)
        linux = spec.setdefault("linux", {})
        linux.setdefault("devices", []).append(json.loads(sys.argv[1]))
        linux.setdefault("resources", {}).setdefault("devices", []).append(json.loads(sys.argv[2]))
        json.dump(spec, sys.stdout)
        ' '{{.DEVICE}}' '{{.ALLOW}}' | podman exec -i {{.NODE}} sh -c 'cat > /etc/gpu-base-spec.json'
      - |
        podman exec {{.NODE}} sh -c "mkdir -p {{.CONTAINERD}}/config-v3.toml.d && printf \"[plugins.'io.containerd.cri.v1.runtime'.containerd.runtimes.runc]\n  base_runtime_spec = \\\"/etc/gpu-base-spec.json\\\"\n\" > {{.CONTAINERD}}/config-v3.toml.d/gpu.toml"
      - podman network disconnect podman {{.NODE}}
      - podman network connect --ip {{.NODE_IP}} podman {{.NODE}}

  down:
    desc: Delete the tools and take the agent back out of ~/.infer - the footage folder is never touched
    cmds:
      - rm -f {{.TOOLS}}/{{.FILMCRAFT_PACKAGE}} {{.TOOLS}}/{{.GYROFLOW_PACKAGE}} {{.TOOLS}}/{{.LUT}}
      - rmdir {{.TOOLS}} 2>/dev/null || true
      - '! grep -qs "^workspace: {{.WORKSPACE}}$" {{.INFER_DIR}}/agents/drone-editor.md || rm {{.INFER_DIR}}/agents/drone-editor.md'
