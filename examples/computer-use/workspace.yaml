name: ubuntu-desktop
kind: kubernetes
context: k3d-computer-use
namespace: computer-use
image: ghcr.io/inference-gateway/computer:latest
storage: 1Gi
idle_ttl: 30m
away_ttl: 1m
retention: 1h
env:
  INFER_GATEWAY_MOCK: "true"
  INFER_GATEWAY_MOCK_SCENARIOS: /opt/agent-computer/scenarios.yaml
  INFER_AGENT_MODEL: mock/openai/gpt-4o
  INFER_COMPUTER_USE_ENABLED: "true"
  INFER_COMPUTER_USE_APPROVAL: never
  INFER_COMPUTER_USE_RECORDING_ENABLED: "true"
  INFER_COMPUTER_USE_RECORDING_REQUIRE_APPROVAL: "false"
  INFER_COMPUTER_USE_RECORDING_OUTPUT_DIR: /home/infer/.infer/artifacts
  INFER_TOOLS_BASH_ALLOW_APPEND: ".*"
  INFER_TOOLS_WRITE_REQUIRE_APPROVAL: "false"
  INFER_TOOLS_EDIT_REQUIRE_APPROVAL: "false"
