models:
  - id: openai/gpt-4o
    object: model
    owned_by: openai
    served_by: openai
    modalities: { input: [text, image], output: [text] }
  - id: anthropic/claude-sonnet-4-5
    object: model
    owned_by: anthropic
    served_by: anthropic
    modalities: { input: [text, image], output: [text] }
  - id: openai/gpt-image-2
    object: model
    owned_by: openai
    served_by: openai
    modalities: { input: [text, image], output: [image] }

fallback:
  content: "Done."

scenarios:
  - name: write-approved
    match: '(?i)create a file named approved\.txt'
    turns:
      - tool_calls:
          - { name: Write, args: { file_path: "approved.txt", content: "hello from e2e" } }
      - content: "The file was written."

  # A user rejection ends the agent loop (CLI issue #786), so a denied tool
  # call never reaches a follow-up turn - the run finishes right after the
  # denial result.
  - name: write-denied
    match: '(?i)create a file named denied\.txt'
    turns:
      - tool_calls:
          - { name: Write, args: { file_path: "denied.txt", content: "should never land" } }

  - name: todo-batched-with-write
    match: '(?i)plan and create a file named todo-batch\.txt'
    turns:
      - tool_calls:
          - { name: TodoWrite, args: { todos: [{ content: "Write todo-batch.txt", status: "in_progress" }] } }
          - { name: Write, args: { file_path: "todo-batch.txt", content: "batched with a todo" } }
      - content: "Todo and file done."

  - name: title-card
    match: '(?i)add a title card'
    turns:
      - tool_calls:
          - name: Write
            args:
              file_path: "title-card.timeline.json"
              content: |
                {
                  "version": 1,
                  "duration": 20,
                  "tracks": [
                    { "id": "video", "kind": "video", "clips": [{ "id": "v1", "src": "media/demo.mov", "start": 0, "end": 20 }] },
                    { "id": "cards", "kind": "overlay", "clips": [{ "id": "o1", "src": "media/o1-title.mov", "html": "cards/o1-title.html", "start": 0, "end": 3 }] }
                  ]
                }
      - content: "Title card added."

  - name: captions
    match: '(?i)add captions'
    turns:
      - tool_calls:
          - name: Write
            args:
              file_path: "captions.timeline.json"
              content: |
                {
                  "version": 1,
                  "duration": 20,
                  "tracks": [
                    { "id": "video", "kind": "video", "clips": [{ "id": "v1", "src": "media/demo.mov", "start": 0, "end": 20 }] },
                    { "id": "captions", "kind": "captions", "style": "classic", "clips": [{ "id": "c1", "start": 0, "end": 4.5, "text": "First we open the settings panel." }] }
                  ]
                }
      - content: "Captions added."

  - name: revert-setup
    match: '(?i)set up the timeline'
    turns:
      - tool_calls:
          - name: Write
            args:
              file_path: "revert.timeline.json"
              content: |
                {
                  "version": 1,
                  "duration": 12,
                  "tracks": [
                    { "id": "video", "kind": "video", "clips": [{ "id": "v1", "src": "media/base.mov", "start": 0, "end": 12 }] }
                  ]
                }
      - content: "Timeline set up."

  - name: revert-captions
    match: '(?i)write the captions track'
    turns:
      - tool_calls:
          - name: Write
            args:
              file_path: "revert.timeline.json"
              content: |
                {
                  "version": 1,
                  "duration": 12,
                  "tracks": [
                    { "id": "video", "kind": "video", "clips": [{ "id": "v1", "src": "media/final.mov", "start": 0, "end": 12 }] },
                    { "id": "captions", "kind": "captions", "style": "classic", "clips": [{ "id": "c1", "start": 0, "end": 4.5, "text": "First we open the settings panel." }] }
                  ]
                }
      - content: "Captions added."

  - name: keyframe-zoom
    match: '(?i)add a slow zoom'
    turns:
      - tool_calls:
          - name: Write
            args:
              file_path: "keyframe-zoom.timeline.json"
              content: |
                {
                  "version": 1,
                  "duration": 20,
                  "tracks": [
                    { "id": "video", "kind": "video", "clips": [{ "id": "v1", "src": "media/demo.mov", "start": 0, "end": 20, "keys": { "scale": [{ "t": 0, "v": 1 }, { "t": 6, "v": 1.4 }] } }] }
                  ]
                }
      - content: "Slow zoom added."

  - name: multi-tool
    match: '(?i)inspect the project and write a summary'
    turns:
      - tool_calls:
          - { name: Read, args: { file_path: "Cargo.toml" } }
          - { name: Read, args: { file_path: "tauri.conf.json" } }
      - tool_calls:
          - { name: Write, args: { file_path: "summary.txt", content: "two files inspected" } }
      - content: "Summary written."

  - name: ask-user-question
    match: '(?i)ask me which language'
    turns:
      - tool_calls:
          - name: AskUserQuestion
            args:
              questions:
                - header: Language
                  question: "Which language should the service use?"
                  options:
                    - { label: "Rust (Recommended)", description: "Matches the backend" }
                    - { label: Go, description: "Matches the CLI" }
                  multiSelect: false
      - content: "Thanks, noted your choice."

  - name: a2a-query-agent
    match: '(?i)what agents.*available'
    turns:
      - tool_calls:
          - { name: A2A_QueryAgent, args: { agent_url: "http://localhost:8085" } }
      - content: "The documentation-agent is available via A2A."

  - name: image-generation
    match: '(?i)generate an image'
    turns:
      - content: |
          # Generated Image

          Here is your generated image:

          ![Generated image](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==)

  # One scenario for every "create a file named sN.txt" prompt (N = 1-9). Each
  # matched session pauses at the Write approval, so several can be live at once
  # (used by the 5-in-parallel e2e test).
  - name: write-parallel
    match: '(?i)create a file named s\d\.txt'
    turns:
      - tool_calls:
          - { name: Write, args: { file_path: "s.txt", content: "parallel" } }
      - content: "Parallel file written."

  - name: computer-use
    match: '(?i)click the button on screen'
    turns:
      - tool_calls:
          - { name: Computer, args: { action: cursor } }
      - tool_calls:
          - { name: Computer, args: { action: click, x: 640, y: 360 } }
      - content: "Clicked."

  - name: reasoning-demo
    match: '(?i)think out loud'
    turns:
      - reasoning: "Let me work through this step by step. First I weigh the options, then the trade-offs. Therefore the answer is 42."
        content: "The answer is 42, plainly."

  - name: queue-first
    match: '(?i)create a file named queue-first\.txt'
    turns:
      - tool_calls:
              - { name: Write, args: { file_path: "queue-first.txt", content: "first" } }
      - content: "First file written."

  - name: queue-second
    match: '(?i)create a file named queue-second\.txt'
    turns:
      - tool_calls:
              - { name: Write, args: { file_path: "queue-second.txt", content: "second" } }
      - content: "Second file written."

  - name: background-job
    match: '(?i)start a slow background job'
    turns:
      - tool_calls:
          - { name: Bash, args: { command: "sleep 20", detached: true } }
      - content: "Job started in the background."

  # Auto mode runs protected tools without a prompt; a fresh chat is back to
  # manual approval (used by auto-mode-scoped).
  - name: write-auto-approve
    match: '(?i)create a file named auto-approve\.txt'
    turns:
      - tool_calls:
          - { name: Write, args: { file_path: "auto-approve.txt", content: "auto approved" } }
      - content: "The file was written."

  # One screenful-plus of markdown followed by a Write that pauses at
  # approval, so a pending approval card sits at the bottom of a long
  # transcript (used by transcript-overflow).
  - name: long-transcript
    match: '(?i)stream a long response and end with a pending write'
    turns:
      - content: |
          # A deliberately long response

          This response exists to fill the transcript far past one screen, so
          the conversation area has to scroll instead of spilling over the
          composer.

          ## Section one

          - First point of many
          - Second point of many
          - Third point of many

          ## Section two

          A fenced block in the middle of the scroll:

          ```rust
          fn long() {
                  for i in 0..100 {
                      println!("line {i} of the long transcript");
                  }
          }
          ```

          ## Section three

          Paragraph after paragraph keeps the transcript growing. The pending
          approval card at the end of this turn is what must stay above the
          composer - if it lands below it, content is escaping the
          conversation area.

          ## Section four

          - More bullets to push the page down
          - Another bullet to push the page down
          - A third bullet to push the page down
          - A fourth bullet to push the page down

          ## Section five

          More filler text keeps streaming in. Scroll behaviour, not content,
          is what this response is testing.

          ## Section six

          - Fill lines keep arriving, one after the other
          - The transcript keeps growing, one after the other
          - The page keeps getting longer, one after the other
          - And there is still more to come, one after the other

          ## Section seven

          Another paragraph of filler text, so the tail of the transcript is
          well past the fold by the time the tool call lands.

          ## Section eight

          - Still scrolling
          - Still scrolling
          - Still scrolling
          - Still scrolling
          - Still scrolling
          - Still scrolling

          ## The end

          Final paragraph before the tool call takes over.
        tool_calls:
          - { name: Write, args: { file_path: "long-transcript.txt", content: "end of the long transcript" } }
      - content: "Written at the end of the long transcript."
