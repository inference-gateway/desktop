models:
  - id: openai/gpt-4o
    object: model
    owned_by: openai
    served_by: openai
    modalities: { input: [text, image], output: [text] }
  - id: anthropic/claude-sonnet-4-5
    object: model
    owned_by: anthropic
    served_by: anthropic
    modalities: { input: [text, image], output: [text] }
  - id: openai/gpt-image-2
    object: model
    owned_by: openai
    served_by: openai
    modalities: { input: [text, image], output: [image] }

fallback:
  content: "Done."

scenarios:
  - name: write-approved
    match: '(?i)create a file named approved\.txt'
    turns:
      - tool_calls:
          - { name: Write, args: { file_path: "approved.txt", content: "hello from e2e" } }
      - content: "The file was written."

  # A user rejection ends the agent loop (CLI issue #786), so a denied tool
  # call never reaches a follow-up turn - the run finishes right after the
  # denial result.
  - name: write-denied
    match: '(?i)create a file named denied\.txt'
    turns:
      - tool_calls:
          - { name: Write, args: { file_path: "denied.txt", content: "should never land" } }

  - name: multi-tool
    match: '(?i)inspect the project and write a summary'
    turns:
      - tool_calls:
          - { name: Read, args: { file_path: "Cargo.toml" } }
          - { name: Read, args: { file_path: "tauri.conf.json" } }
      - tool_calls:
          - { name: Write, args: { file_path: "summary.txt", content: "two files inspected" } }
      - content: "Summary written."

  - name: markdown-showcase
    match: '(?i)show me some markdown'
    turns:
      - content: |
          # Markdown Showcase

          Here is some **bold text** and *italics* and `inline code`.

          - First bullet point
          - Second bullet point
          - Third bullet point

          A fenced code block:

          ```rust
          fn main() {
              println!("hello, markdown");
          }
          ```

          And a [link to the gateway](https://github.com/inference-gateway).

  - name: a2a-query-agent
    match: '(?i)what agents.*available'
    turns:
      - tool_calls:
          - { name: A2A_QueryAgent, args: { agent_url: "http://localhost:8085" } }
      - content: "The documentation-agent is available via A2A."

  - name: image-generation
    match: '(?i)generate an image'
    turns:
      - content: |
          # Generated Image

          Here is your generated image:

          ![Generated image](data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==)

  # One scenario for every "create a file named sN.txt" prompt (N = 1-9). Each
  # matched session pauses at the Write approval, so several can be live at once
  # (used by the 5-in-parallel e2e test).
  - name: write-parallel
    match: '(?i)create a file named s\d\.txt'
    turns:
      - tool_calls:
          - { name: Write, args: { file_path: "s.txt", content: "parallel" } }
      - content: "Parallel file written."

  - name: write-project-test
    match: '(?i)create a file named project-test\.txt'
    turns:
      - tool_calls:
          - { name: Write, args: { file_path: "project-test.txt", content: "hello from e2e" } }
      - content: "The file was written."

  - name: computer-use
    match: '(?i)click the button on screen'
    turns:
      - tool_calls:
          - { name: mouse_click, args: { x: 100, y: 200 } }
      - content: "Clicked."

  - name: reasoning-demo
    match: '(?i)think out loud'
    turns:
      - reasoning: "Let me work through this step by step. First I weigh the options, then the trade-offs. Therefore the answer is 42."
        content: "The answer is 42, plainly."

