name: multi-project broadcast - fan-out to multiple selected projects
cleanup:
  - approved.txt
narration:
  - "Open a fresh chat."
  - "Create a project from the sidebar."
  - "Name it e2e-bcast-a."
  - "The project shows up in the sidebar."
  - "Create a second project."
  - "Name it e2e-bcast-b."
  - "The second project shows up too."
  - "Open the broadcast sheet."
  - "Selection mode starts with everything selected."
  - "Clear the selection."
  - "All projects are deselected."
  - "Stage project e2e-bcast-a for the fan-out."
  - "Stage project e2e-bcast-b as well."
  - "Two projects are staged."
  - "Send the prompt; every staged project runs it in its own session."
  - "The fan-out count shows 2."
  - "Both children pause at the Write approval - approving is the precondition for the file landing."
  - "Approve from the broadcast view."
  - "Both sessions complete and confirm the write."
steps:
  - new_chat
  - click: { button: "New project" }
  - type: "e2e-bcast-a"
  - wait_for: { text: "e2e-bcast-a", timeout: 15 }
  - click: { button: "New project" }
  - type: "e2e-bcast-b"
  - wait_for: { text: "e2e-bcast-b", timeout: 15 }
  - click: { button: "Broadcast to projects" }
  - wait_for: { button: "Deselect all projects", timeout: 10 }
  - click: { button: "Deselect all projects" }
  - wait_for: { button: "Select all projects", timeout: 10 }
  - click: { button: "Toggle init for project e2e-bcast-a" }
  - click: { button: "Toggle init for project e2e-bcast-b" }
  - wait_for: { button: "Init 2 projects", timeout: 10 }
  - send: "create a file named approved.txt"
  - wait_for: { text: "2", timeout: 15 }
  - wait_for: { button: "Approve", timeout: 30 }
  - click: { button: "Approve" }
  - wait_for: { text: "The file was written.", timeout: 60 }
