name: multi-tool flow - reads auto-run, write needs approval
cleanup:
  - summary.txt
narration:
  - "Open a fresh chat."
  - "Ask for an inspection plus a summary file: a Read-heavy turn followed by a Write."
  - "The Reads auto-run; the Write pauses for approval - reads are safe, writes ask."
  - "Approve the Write."
  - "summary.txt lands."
  - "The agent confirms the summary."
steps:
  - new_chat
  - send: "inspect the project and write a summary"
  - wait_for: { button: "Approve", timeout: 30 }
  - click: { button: "Approve" }
  - wait_for: { file: "summary.txt", timeout: 15 }
  - wait_for: { text: "Summary written.", timeout: 15 }
