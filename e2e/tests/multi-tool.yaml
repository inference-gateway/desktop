name: multi-tool flow - reads auto-run, write needs approval
cleanup:
  - summary.txt
steps:
  - new_chat
  - send: "inspect the project and write a summary"
  - wait_for: { button: "Approve", timeout: 30 }
  - click: { button: "Approve" }
  - wait_for: { file: "summary.txt", timeout: 15 }
  - wait_for: { text: "Summary written.", timeout: 15 }
