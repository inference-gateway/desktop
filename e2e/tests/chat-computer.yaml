name: chat computer - an agent's computer shows inside its transcript, minimizes by itself and comes back on a click
workspace_agent: e2e-pilot
narration:
  - "Switch the sidebar to the Agents filter."
  - "Pick the agent that has a computer of its own."
  - "Send it a task, which teleports the new chat to its workspace first."
  - "The computer's screen shows inside the transcript."
  - "A few seconds later it minimizes to a tab on the right edge."
  - "The agent answers from its computer."
  - "Click the tab."
  - "The screen is back."
  - "Click the screen."
  - "It is a tab again."
steps:
  - click: { button: "Filter agents" }
  - click: { button: "Select agent e2e-pilot" }
  - send: "open the docs on your computer"
  - wait_for: { button: "Minimize computer e2e-pilot", timeout: 30 }
  - wait_for: { button: "Show computer e2e-pilot", timeout: 15 }
  - wait_for: { text: "The docs are open.", timeout: 30 }
  - click: { button: "Show computer e2e-pilot" }
  - wait_for: { button: "Minimize computer e2e-pilot", timeout: 10 }
  - click: { button: "Minimize computer e2e-pilot" }
  - wait_for: { button: "Show computer e2e-pilot", timeout: 10 }
