name: clip volume - selecting an audio clip shows its own volume in the clip inspector
content_project: e2e-volume
narration:
  - "Open a fresh chat."
  - "Pick the content project - its workspace is the timeline editor."
  - "Ask to duck the music; the agent writes a timeline whose audio clip carries volume 0.5."
  - "The Write pauses for approval - approving is the precondition for the file landing."
  - "Approve it."
  - "The clip lands on the audio lane."
  - "Select it: the inspector opens right under the lanes."
  - "Its volume slider reads the clip's own level."
  - "The agent confirms."
steps:
  - new_chat
  - click: { button: "Select project e2e-volume" }
  - send: "duck the music bed"
  - wait_for: { button: "Approve", timeout: 30 }
  - click: { button: "Approve" }
  - wait_for: { button: "bed.mp3 (missing)", timeout: 20 }
  - click: { button: "bed.mp3 (missing)" }
  - wait_for: { text: "50%", timeout: 10 }
  - wait_for: { text: "Music ducked.", timeout: 15 }
