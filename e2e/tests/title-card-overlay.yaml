name: title card overlay - the agent writes an overlay track onto a content project's timeline
content_project: e2e-title
narration:
  - "Open a fresh chat."
  - "Pick the content project - its workspace is the timeline editor, with the chat docked beside it."
  - "Ask for a title card; the model returns a Write of title-card.timeline.json."
  - "The Write pauses for approval - approving is the precondition for the file landing."
  - "Approve it."
  - "The timeline picks the new file up and stacks an Overlay lane above the video."
  - "The title card itself is a clip on that lane."
  - "The agent confirms."
steps:
  - new_chat
  - click: { button: "Select project e2e-title" }
  - send: "add a title card saying Hello"
  - wait_for: { button: "Approve", timeout: 30 }
  - click: { button: "Approve" }
  - wait_for: { button: "Hide overlay lane cards", timeout: 20 }
  - wait_for: { button: "o1-title.mov", timeout: 10 }
  - wait_for: { text: "Title card added.", timeout: 15 }
