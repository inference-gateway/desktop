name: workspace form - a Kubernetes workspace with its computers' resources and a read-only volume is added in Settings and lands in daemon.yaml
narration:
  - "Open Settings."
  - "Switch to the Workspaces tab."
  - "Start a new workspace."
  - "Name it."
  - "Name the Kubernetes context of its cluster."
  - "Name the namespace its sessions run in."
  - "Name the image its computers run."
  - "Each computer asks for two CPUs."
  - "It may use up to eight."
  - "It asks for 4Gi of memory."
  - "It may use up to 12Gi."
  - "Add a volume to it."
  - "Name the volume."
  - "Name the claim it mounts, which already exists in the namespace."
  - "Say where the computers mount it."
  - "Mount it read-only, so the agent copies the footage before editing it."
  - "Save the workspace."
  - "It shows up in the list, ready to be edited."
  - "Its cluster is checked for what sessions need, and the check finds the claim."
  - "The daemon's configuration file holds it."
  - "It starts with every capability on, so the variable that registers the record tools is there too."
  - "The resources block holds the memory request."
  - "And the memory limit."
  - "The volume and its claim are there."
  - "It is read-only there too."
  - "Settings asks for a CLI restart so the daemon loads it."
steps:
  - click: { button: "Settings" }
  - click: { button: "Workspaces" }
  - click: { button: "New workspace" }
  - type: "e2e-cluster"
  - type: "k3d-e2e"
  - type: "e2e-agents"
  - type: "ghcr.io/inference-gateway/computer:latest"
  - type: "2"
  - type: "8"
  - type: "4Gi"
  - type: "12Gi"
  - click: { button: "Add volume" }
  - type: "footage"
  - type: "raw-footage"
  - type: "/mnt/footage"
  - click: { button: "Volume 1 read-only" }
  - click: { button: "Save workspace" }
  - wait_for: { button: "Edit workspace e2e-cluster", timeout: 10 }
  - wait_for: { text: "Cluster has everything it needs", timeout: 10 }
  - wait_for: { file: "e2e/artifacts/home/.infer/daemon.yaml", contains: "name: e2e-cluster", timeout: 10 }
  - wait_for: { file: "e2e/artifacts/home/.infer/daemon.yaml", contains: "INFER_COMPUTER_USE_RECORDING_ENABLED", timeout: 10 }
  - wait_for: { file: "e2e/artifacts/home/.infer/daemon.yaml", contains: "memory: 4Gi", timeout: 10 }
  - wait_for: { file: "e2e/artifacts/home/.infer/daemon.yaml", contains: "memory: 12Gi", timeout: 10 }
  - wait_for: { file: "e2e/artifacts/home/.infer/daemon.yaml", contains: "claim: raw-footage", timeout: 10 }
  - wait_for: { file: "e2e/artifacts/home/.infer/daemon.yaml", contains: "read_only: true", timeout: 10 }
  - wait_for: { button: "Restart CLI now", timeout: 5 }
