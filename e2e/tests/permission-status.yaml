name: computer use permissions start not granted and flip after Grant in mock mode
narration:
  - "Open Settings; mock mode simulates the macOS TCC permission flow."
  - "Both permissions start not granted."
  - "Request Accessibility."
  - "The first banner flips to granted - the mock flips statuses when the request command runs."
  - "Request Screen Recording."
  - "Screenshot the granted state."
steps:
  - click: { button: "Settings" }
  - wait_for: { text: "Not granted", timeout: 10 }
  - click: { button: "Grant Accessibility" }
  - wait_for: { text: "Granted", timeout: 10 }
  - click: { button: "Grant Screen Recording" }
  - screenshot: "permission-grant-flow"
