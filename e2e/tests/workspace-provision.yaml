name: workspace provisioning - one click runs a local k3s cluster with an ubuntu-desktop workspace
narration:
  - "Open Settings."
  - "Switch to the Workspaces tab."
  - "With Docker running, the tab offers a local cluster."
  - "Provision it with one click - mock mode skips Docker and only registers the workspace."
  - "The ubuntu-desktop workspace shows up in the list."
  - "The daemon's configuration file holds it, on the local cluster's context."
  - "Settings asks for a CLI restart so the daemon loads it."
steps:
  - click: { button: "Settings" }
  - click: { button: "Workspaces" }
  - wait_for: { button: "Provision local cluster", timeout: 10 }
  - click: { button: "Provision local cluster" }
  - wait_for: { button: "Edit workspace ubuntu-desktop", timeout: 15 }
  - wait_for: { file: "e2e/artifacts/home/.infer/daemon.yaml", contains: "context: infer-k3s", timeout: 10 }
  - wait_for: { button: "Restart CLI now", timeout: 5 }
