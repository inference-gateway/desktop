name: five sessions run in parallel with a configurable cap
narration:
  - "Open chat 1 of 5 - five will run at the same time."
  - "Ask for a file that pauses at approval, so the session stays live."
  - "Session 1 is waiting at its approval card."
  - "Open chat 2; a running session does not block a new one."
  - "Session 2 asks for its own file."
  - "Session 2 is live as well - two infer children stream at once."
  - "Open chat 3."
  - "Session 3 asks for its file."
  - "Three live sessions."
  - "Open chat 4."
  - "Session 4 asks for its file."
  - "Four live sessions."
  - "Open chat 5."
  - "Session 5 asks for its file."
  - "Five live sessions - the configured cap (default 5) is reached."
  - "Screenshot all five waiting at once (approving a background session is verified manually - the AX harness clicks buttons, not sidebar items)."
  - "Open a sixth chat."
  - "The sixth send is rejected."
  - "The cap error surfaces in the transcript."
cleanup:
  - s.txt
steps:
  - new_chat
  - send: "create a file named s1.txt"
  - wait_for: { button: "Approve", timeout: 30 }
  - new_chat
  - send: "create a file named s2.txt"
  - wait_for: { button: "Approve", timeout: 30 }
  - new_chat
  - send: "create a file named s3.txt"
  - wait_for: { button: "Approve", timeout: 30 }
  - new_chat
  - send: "create a file named s4.txt"
  - wait_for: { button: "Approve", timeout: 30 }
  - new_chat
  - send: "create a file named s5.txt"
  - wait_for: { button: "Approve", timeout: 30 }
  - screenshot: "five-parallel-sessions"
  - new_chat
  - send: "create a file named s6.txt"
  - wait_for: { text: "Max 5 concurrent sessions reached", timeout: 10 }
