name: voice sample test - a sample reads a paragraph before any agent speaks in it
voice_sample: narrator
narration:
  - "Open Settings."
  - "Switch to the Voice samples tab."
  - "The sample is in the library, with a button to test it."
  - "A quiet recording is called out, so a weak sample is no surprise."
  - "Test it: the sample reads the test text the way an agent would."
  - "The reading is a WAV of its own, one per sample."
  - "It plays right under the sample."
steps:
  - click: { button: "Settings" }
  - click: { button: "Voice samples" }
  - wait_for: { button: "Test voice narrator.wav", timeout: 10 }
  - wait_for: { text: "Very quiet - move closer to the microphone.", timeout: 10 }
  - click: { button: "Test voice narrator.wav" }
  - wait_for: { file: "e2e/artifacts/home/.infer/tmp/media/tts/voice-test-narrator.wav", timeout: 60 }
  - wait_for: { text: "How an agent sounds in this voice", timeout: 10 }
