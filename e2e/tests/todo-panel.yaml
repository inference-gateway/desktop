name: todo panel - the todo in progress stays in view when the list is folded away
narration:
  - "Open a fresh chat."
  - "Ask for a plan: the agent writes a todo list and works through it."
  - "The agent finishes its turn."
  - "Fold the list away."
  - "The todo in progress is still there, in the panel's header."
  - "Keep a picture of the folded panel."
  - "Unfold it again."
  - "Keep a picture of the list, with the time each todo took."
steps:
  - new_chat
  - send: "plan the release notes"
  - wait_for: { text: "Notes planned.", timeout: 30 }
  - click: { button: "Toggle todo panel" }
  - wait_for: { text: "Write the notes", timeout: 10 }
  - screenshot: "todo-panel-folded"
  - click: { button: "Toggle todo panel" }
  - screenshot: "todo-panel-open"
