name: image generation renders in chat transcript
narration:
  - "Open a fresh chat."
  - "Ask for an image; the model answers with a markdown image."
  - "The heading renders in the transcript."
  - "The generated image renders inline from the data URI."
steps:
  - new_chat
  - send: "generate an image of a cat"
  - wait_for: { text: "Generated Image", timeout: 30 }
  - wait_for: { text: "Here is your generated image", timeout: 15 }
