name: captions - the agent writes a captions track onto a content project's timeline
content_project: e2e-captions
narration:
  - "Open a fresh chat."
  - "Pick the content project - its workspace is the timeline editor, with the chat docked beside it."
  - "Ask for captions; the model returns a Write of captions.timeline.json."
  - "The Write pauses for approval - approving is the precondition for the file landing."
  - "Approve it."
  - "The timeline picks the new file up and stacks a Captions lane above the video."
  - "The caption itself is a clip on that lane, with its text on the face."
  - "The agent confirms."
steps:
  - new_chat
  - click: { button: "Select project e2e-captions" }
  - send: "add captions to this recording"
  - wait_for: { button: "Approve", timeout: 30 }
  - click: { button: "Approve" }
  - wait_for: { button: "Hide captions lane captions", timeout: 20 }
  - wait_for: { button: "First we open the settings panel.", timeout: 10 }
  - wait_for: { text: "Captions added.", timeout: 15 }
