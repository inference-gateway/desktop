name: queued prompt - a follow-up typed mid-run is sent when the turn ends
cleanup:
  - queue-first.txt
  - queue-second.txt
narration:
  - "Open a fresh chat."
  - "Send a first prompt; it pauses at the Write approval."
  - "The first session is waiting."
  - "Type a follow-up while the run is still going."
  - "The prompt is queued, not sent."
  - "The queued chip sits above the composer, inside the conversation area."
  - "Approve the first Write."
  - "The queued prompt is sent and pauses at its own approval."
  - "Approve the second Write."
  - "The follow-up turn completes."
  - "The second file lands."
steps:
  - new_chat
  - send: "create a file named queue-first.txt"
  - wait_for: { button: "Approve", timeout: 30 }
  - send: "create a file named queue-second.txt"
  - wait_for: { text: "Queued:", timeout: 10 }
  - assert_above_composer: { button: "Discard queued prompt" }
  - click: { button: "Approve" }
  - wait_for: { button: "Approve", timeout: 30 }
  - click: { button: "Approve" }
  - wait_for: { text: "Second file written.", timeout: 30 }
  - wait_for: { file: "queue-second.txt", timeout: 30 }
