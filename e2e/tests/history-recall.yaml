name: prompt history recall with arrow keys
narration:
  - "Open a fresh chat."
  - "Send a prompt so it lands in the prompt history."
  - "The run completes - no scenario matches, the gateway fallback answers."
  - "macOS only: ArrowUp in the composer recalls the previous prompt (CI only parses the YAML)."
  - "The composer now holds the recalled prompt - fails when recall breaks."
steps:
  - new_chat
  - send: "remember this prompt for history recall"
  - wait_for: { text: "Done.", timeout: 30 }
  - keypress: "up"
  - assert_composer: { text: "remember this prompt for history recall" }
