name: approval flow - approve executes the tool
cleanup:
  - approved.txt
narration:
  - "Open a fresh chat."
  - "Ask for a file; the Write tool call pauses for approval."
  - "The approval card shows Approve and Deny."
  - "Press 'a' to approve the action."
  - "Approved, the Write runs and approved.txt lands in the project directory."
  - "The agent confirms the file was written."
steps:
  - new_chat
  - send: "create a file named approved.txt"
  - wait_for: { button: "Approve", timeout: 30 }
  - keypress: "a"
  - wait_for: { file: "approved.txt", timeout: 15 }
  - wait_for: { text: "The file was written.", timeout: 15 }
