name: workspace settings - a Kubernetes workspace is added in Settings and lands in daemon.yaml
narration:
  - "Open Settings."
  - "Switch to the Workspaces tab."
  - "Start a new workspace."
  - "Name it."
  - "Name the Kubernetes context of its cluster."
  - "Name the namespace its sessions run in."
  - "Save the workspace."
  - "It shows up in the list, ready to be edited."
  - "Its cluster is checked for what sessions need."
  - "The daemon's configuration file holds it."
  - "It starts with every capability on, so the variable that registers the record tools is there too."
  - "Settings asks for a CLI restart so the daemon loads it."
steps:
  - click: { button: "Settings" }
  - click: { button: "Workspaces" }
  - click: { button: "New workspace" }
  - type: "e2e-cluster"
  - type: "k3d-e2e"
  - type: "e2e-agents"
  - click: { button: "Save workspace" }
  - wait_for: { button: "Edit workspace e2e-cluster", timeout: 10 }
  - wait_for: { text: "Cluster has everything it needs", timeout: 10 }
  - wait_for: { file: "e2e/artifacts/home/.infer/daemon.yaml", contains: "name: e2e-cluster", timeout: 10 }
  - wait_for: { file: "e2e/artifacts/home/.infer/daemon.yaml", contains: "INFER_COMPUTER_USE_RECORDING_ENABLED", timeout: 10 }
  - wait_for: { button: "Restart CLI now", timeout: 5 }
