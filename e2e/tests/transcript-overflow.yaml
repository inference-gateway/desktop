name: long transcript scrolls instead of overflowing the conversation area
cleanup:
  - long-transcript.txt
narration:
  - "Open a fresh chat."
  - "One scenario streams a screenful-plus of markdown, then a Write pauses at approval."
  - "The pending approval card sits at the bottom of the long transcript."
  - "The Approve button must stay above the composer - the transcript scrolls instead of overflowing."
steps:
  - new_chat
  - send: "stream a long response and end with a pending write"
  - wait_for: { button: "Approve", timeout: 30 }
  - assert_above_composer: { button: "Approve" }
