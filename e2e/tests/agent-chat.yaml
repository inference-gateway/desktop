name: agents - creating an agent from the sidebar opens a chat with it
narration:
  - "Switch the sidebar to the Agents filter."
  - "Start a new agent."
  - "Name it e2e-helper."
  - "Describe what it is for."
  - "Give it its instructions."
  - "Pick the animated robot as its face."
  - "Save it, which also downloads the robot beside the agent file."
  - "The agent is selected and the composer addresses it."
  - "Send it a prompt."
  - "The reply lands."
  - "The agent sits in the sidebar with its chat."
  - "Leave the agent."
steps:
  - click: { button: "Filter agents" }
  - click: { button: "New agent" }
  - type: "e2e-helper"
  - type: "Answers e2e questions tersely"
  - type: "You are the e2e helper. Keep every answer to one line."
  - click: { button: "Use animated robot" }
  - click: { button: "Save agent" }
  - wait_for: { button: "Leave agent e2e-helper", timeout: 15 }
  - send: "hi"
  - wait_for: { text: "Done.", timeout: 30 }
  - wait_for: { button: "Select agent e2e-helper", timeout: 5 }
  - click: { button: "Leave agent e2e-helper" }
