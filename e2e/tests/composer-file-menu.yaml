name: typing @ in the composer picks a project file from a menu
narration:
  - "Open a fresh chat."
  - "Send a first message so the CLI is up."
  - "The run completes - no scenario matches, the gateway fallback answers."
  - "Type @ in the composer."
  - "A menu lists the project's files."
  - "Narrow it to main and press Enter."
  - "The composer now holds the picked file as @<path>, ready to send."
steps:
  - new_chat
  - send: "hi"
  - wait_for:
      text: "Done."
      timeout: 30
  - keypress: "@"
  - wait_for:
      button: "README.md"
      timeout: 10
  - type: "main"
  - assert_composer:
      text: "@backend/src/main.rs"
