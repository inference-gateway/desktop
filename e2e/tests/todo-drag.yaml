name: todo drag - a todo dragged by its grip onto another moves above it
narration:
  - "Open a fresh chat."
  - "Ask for a plan: the agent writes a todo list and works through it."
  - "The agent finishes its turn."
  - "The list folds away, with the todo in progress in the panel's header."
  - "Unfold it."
  - "The list is open again."
  - "Gather the changes is done and sits above Write the notes, which is in progress."
  - "Drag Write the notes by its grip onto Gather the changes."
  - "Write the notes now sits above Gather the changes."
steps:
  - new_chat
  - send: "plan the release notes"
  - wait_for: { text: "Notes planned.", timeout: 30 }
  - wait_gone: { button: "Todo status: in_progress", timeout: 20 }
  - click: { button: "Toggle todo panel" }
  - wait_for: { button: "Todo status: completed", timeout: 10 }
  - assert_order: { above: "Todo status: completed", below: "Todo status: in_progress" }
  - drag: { from: "Todo status: in_progress", from_dx: -20, to: "Todo status: completed" }
  - assert_order: { above: "Todo status: in_progress", below: "Todo status: completed" }
