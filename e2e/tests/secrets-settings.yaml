name: secrets settings - a secret is kept once, its value only in auth.yaml
narration:
  - "Open Settings."
  - "Switch to the Secrets tab."
  - "Start a new secret."
  - "Label it."
  - "Name the variable it becomes."
  - "Type its value - masked, and never shown again."
  - "Save the secret."
  - "It shows up in the list, ready to be edited."
  - "It goes nowhere yet, so no process gets it."
  - "secrets.yaml names its variable, never its value."
  - "auth.yaml holds the value."
steps:
  - click: { button: "Settings" }
  - click: { button: "Secrets" }
  - click: { button: "New secret" }
  - type: "e2e-token"
  - type: "E2E_TOKEN"
  - type: "e2e-secret-value"
  - click: { button: "Save secret" }
  - wait_for: { button: "Edit secret e2e-token", timeout: 10 }
  - wait_for: { text: "Assigned nowhere, so no process gets it", timeout: 5 }
  - wait_for: { file: "e2e/artifacts/home/.infer/secrets.yaml", contains: "variable: E2E_TOKEN", timeout: 10 }
  - wait_for: { file: "e2e/artifacts/home/.infer/auth.yaml", contains: "e2e-secret-value", timeout: 10 }
