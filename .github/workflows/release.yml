name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/create-github-app-token@v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.INFERENCE_GATEWAY_MAINTAINER_APP_CLIENT_ID }}
          private-key: ${{ secrets.INFERENCE_GATEWAY_MAINTAINER_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install semantic-release and plugins
        run: |
          mkdir -p "$RUNNER_TEMP/semantic-release"
          cp .github/semantic-release/package.json "$RUNNER_TEMP/semantic-release/"
          npm install --prefix "$RUNNER_TEMP/semantic-release"
          echo "$RUNNER_TEMP/semantic-release/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Compute next version
        id: next
        shell: bash
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          semantic-release --dry-run 2>&1 | tee dry-run.log
          version="$(grep -oE 'next release version is [0-9]+\.[0-9]+\.[0-9]+' dry-run.log | tail -1 | awk '{print $NF}' || true)"
          if [ -z "$version" ]; then
            echo "::error::no next version in the semantic-release dry run - either there are no releasable commits, or the version is not a plain X.Y.Z"
            exit 1
          fi
          echo "Next version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs:
      - version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            args: ""
            artifact_name: bundle-linux
          - os: macos-latest
            args: "--target universal-apple-darwin"
            artifact_name: bundle-macos
          - os: windows-latest
            args: ""
            artifact_name: bundle-windows
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Stamp version and updater public key
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PUBKEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
          PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -z "$PUBKEY" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::error::Updater signing keys are not configured. Generate a pair with 'cargo tauri signer generate', then set the TAURI_SIGNING_PUBLIC_KEY repository variable and the TAURI_SIGNING_PRIVATE_KEY secret (see CONTRIBUTING.md)."
            exit 1
          fi
          jq --arg v "$VERSION" --arg k "$PUBKEY" \
            '.version = $v | .plugins.updater.pubkey = $k' \
            backend/tauri.conf.json > tauri.conf.stamped.json
          mv tauri.conf.stamped.json backend/tauri.conf.json
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$APPLE_CERTIFICATE" ]; then
            jq '.bundle.macOS.signingIdentity = "Inference Gateway Desktop Signing"' \
              backend/tauri.conf.json > tauri.conf.stamped.json
            mv tauri.conf.stamped.json backend/tauri.conf.json
          fi

      - name: Trust macOS signing certificate
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "$APPLE_CERTIFICATE" | base64 --decode > cert.p12
            /usr/bin/openssl pkcs12 -in cert.p12 -clcerts -nokeys \
              -passin "pass:$APPLE_CERTIFICATE_PASSWORD" -out cert.pem
            sudo security add-trusted-cert -d -r trustRoot \
              -k /Library/Keychains/System.keychain cert.pem
            rm cert.p12 cert.pem
          fi

      - name: Build Tauri bundles
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        with:
          projectPath: backend
          args: ${{ matrix.args }}

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.artifact_name }}
          path: target/**/release/bundle/**
          if-no-files-found: error

  release:
    needs:
      - version
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/create-github-app-token@v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.INFERENCE_GATEWAY_MAINTAINER_APP_CLIENT_ID }}
          private-key: ${{ secrets.INFERENCE_GATEWAY_MAINTAINER_APP_PRIVATE_KEY }}

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Set up Git
        run: |
          git config --global user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --global user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
          git config --global commit.gpgsign false
          git config --global commit.signoff true

      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Install semantic-release and plugins
        run: |
          mkdir -p "$RUNNER_TEMP/semantic-release"
          cp .github/semantic-release/package.json "$RUNNER_TEMP/semantic-release/"
          npm install --prefix "$RUNNER_TEMP/semantic-release"
          echo "$RUNNER_TEMP/semantic-release/node_modules/.bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts

      - name: Generate updater manifest
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag="v$VERSION"
          platforms='{}'
          while IFS= read -r sig; do
            asset="$(basename "${sig%.sig}" | tr ' ' '.')"
            case "$asset" in
              *.app.tar.gz) keys="darwin-aarch64 darwin-x86_64" ;;
              *.AppImage) keys="linux-x86_64" ;;
              *-setup.exe) keys="windows-x86_64" ;;
              *) echo "Skipping unmapped updater artifact $asset"; continue ;;
            esac
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$asset"
            for key in $keys; do
              platforms="$(jq --arg k "$key" --arg s "$(cat "$sig")" --arg u "$url" \
                '.[$k] = {signature: $s, url: $u}' <<<"$platforms")"
            done
          done < <(find artifacts -name '*.sig' | sort)

          if [ "$(jq 'length' <<<"$platforms")" -ne 4 ]; then
            echo "::error::latest.json needs all four platform keys, got $(jq -c 'keys' <<<"$platforms")"
            exit 1
          fi

          jq -n --arg v "$VERSION" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson p "$platforms" \
            '{version: $v, pub_date: $d, platforms: $p}' > artifacts/latest.json
          cat artifacts/latest.json

      - name: Create a release if needed
        env:
          CI: true
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
          GIT_AUTHOR_EMAIL: ${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: ${{ steps.app-token.outputs.app-slug }}[bot]
          GIT_COMMITTER_EMAIL: ${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com
        run: semantic-release
