name: E2E

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled
    paths-ignore:
      - '*.md'
      - '**/*.md'
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event.action != 'labeled' || github.event.label.name == 'ci:macos' }}

env:
  SMOKE_SPECS: >-
    tests/agent-switch.yaml
    tests/approval-todo-batch.yaml
    tests/reasoning.yaml
    tests/compute-settings.yaml

jobs:
  e2e:
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'ci:macos') && (github.event.action != 'labeled' || github.event.label.name == 'ci:macos'))
    runs-on: macos-15
    timeout-minutes: ${{ github.event_name == 'pull_request' && 30 || 45 }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Build frontend
        run: bun install --frozen-lockfile && bun run build

      - name: Run the smoke specs
        if: github.event_name == 'pull_request'
        working-directory: e2e
        run: cargo run -- ${{ env.SMOKE_SPECS }}

      - name: Run the full suite
        if: github.event_name != 'pull_request'
        working-directory: e2e
        run: cargo run

      - name: Upload what the failing specs saw
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-artifacts
          path: |
            e2e/artifacts/*.png
            e2e/artifacts/*.log
            e2e/artifacts/*.mov
          if-no-files-found: ignore

  e2e-linux:
    if: github.event_name != 'pull_request' || github.event.action != 'labeled' || github.event.label.name == 'ci:macos'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      WEBKIT_DISABLE_DMABUF_RENDERER: 1
      WEBKIT_DISABLE_COMPOSITING_MODE: 1
      LIBGL_ALWAYS_SOFTWARE: 1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install the Linux build's libraries, Xvfb and WebKitWebDriver
        run: |
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources; do
                if [ -f "$f" ]; then
                  sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu|g; s|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' "$f"
                fi
          done
          for attempt in 1 2 3; do
              if sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb; then
                break
              fi
              echo "apt failed on attempt $attempt, retrying in 30 s" >&2
              [ "$attempt" -lt 3 ] || exit 1
              sleep 30
          done

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true

      - name: Install tauri-driver at the version the e2e image pins
        run: cargo install tauri-driver --locked --version "$(sed -n 's/^ARG TAURI_DRIVER_VERSION=//p' e2e/Containerfile)"

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Build frontend
        run: bun install --frozen-lockfile && bun run build

      - name: Run the full suite
        working-directory: e2e
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" cargo run

      - name: Upload what the failing specs saw
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-linux-artifacts
          path: |
            e2e/artifacts/*.png
            e2e/artifacts/*.log
          if-no-files-found: ignore
