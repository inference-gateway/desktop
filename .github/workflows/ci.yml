name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Enforces insert_final_newline from .editorconfig (editors fix
      # files on save; this catches everything else).
      - name: Check final newlines
        working-directory: ${{ github.workspace }}
        run: |
          fail=0
          for f in $(git ls-files | grep -vE '\.(png|icns|ico)$'); do
                [ -f "$f" ] || continue
                if [ -n "$(tail -c1 "$f")" ]; then
                  echo "missing final newline: $f"
                  fail=1
                fi
          done
          exit $fail

      - uses: Swatinem/rust-cache@v2.9.2

      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@v1.6.3
        with:
          packages: libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
          version: 1.0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The Rust build embeds frontendDist (../dist) via generate_context!, so
      # the frontend must be built before any cargo compile step.
      - name: Build frontend
        working-directory: ${{ github.workspace }}
        run: bun install --frozen-lockfile && bun run build

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint with clippy
        run: cargo clippy -- -D warnings

      - name: Build and test
        run: cargo test
