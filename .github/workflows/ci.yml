name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - labeled

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' && (github.event.action != 'labeled' || github.event.label.name == 'ci:macos') }}

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      markdown: ${{ steps.filter.outputs.markdown }}
      markdown_only: ${{ steps.markdown-only.outputs.markdown_only }}
      markdown_files: ${{ steps.filter.outputs.markdown_files }}
    steps:
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          list-files: shell
          predicate-quantifier: some-with-excludes
          filters: |
            markdown:
              - '*.md'
              - '**/*.md'
            code:
              - '**'
              - '!*.md'
              - '!**/*.md'

      - name: Compute markdown_only
        id: markdown-only
        env:
          MARKDOWN: ${{ steps.filter.outputs.markdown }}
          CODE: ${{ steps.filter.outputs.code }}
        run: |
          if [ "$MARKDOWN" = 'true' ] && [ "$CODE" != 'true' ]; then
            echo "markdown_only=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    if: always() && (github.event.action != 'labeled' || github.event.label.name == 'ci:macos')
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
          - windows-2025
        exclude:
          - os: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ci:macos') && 'macos-15' || 'none' }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Markdown-only pull request - skipping the build-and-test matrix
        working-directory: ${{ github.workspace }}
        if: needs.changes.outputs.markdown_only == 'true'
        run: echo "Only .md files changed - no bun, cargo or CLI-contract steps run; the markdown-lint job checks the changed files"

      - uses: actions/checkout@v7.0.1
        if: needs.changes.outputs.markdown_only != 'true'

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        if: needs.changes.outputs.markdown_only != 'true'
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.3
        if: needs.changes.outputs.markdown_only != 'true'

      - name: Install system dependencies
        if: needs.changes.outputs.markdown_only != 'true' && runner.os == 'Linux'
        run: |
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources; do
                if [ -f "$f" ]; then
                  sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt/ubuntu|https://archive.ubuntu.com/ubuntu|g; s|mirror+file:/etc/apt/apt-mirrors.txt|https://archive.ubuntu.com/ubuntu|g; s|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' "$f"
                fi
          done
          for attempt in 1 2 3; do
              if sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev; then
                break
              fi
              echo "apt failed on attempt $attempt, retrying in 30 s" >&2
              [ "$attempt" -lt 3 ] || exit 1
              sleep 30
          done

      - uses: oven-sh/setup-bun@v2.2.0
        if: needs.changes.outputs.markdown_only != 'true'
        with:
          bun-version-file: .bun-version

      - name: Build frontend
        if: needs.changes.outputs.markdown_only != 'true'
        working-directory: ${{ github.workspace }}
        run: bun install --frozen-lockfile && bun run build

      - name: Test frontend
        if: needs.changes.outputs.markdown_only != 'true'
        working-directory: ${{ github.workspace }}
        run: bun test

      - name: Check formatting
        if: needs.changes.outputs.markdown_only != 'true'
        run: cargo fmt --check

      - name: Lint with clippy
        if: needs.changes.outputs.markdown_only != 'true'
        run: cargo clippy -- -D warnings

      - name: Build and test
        if: needs.changes.outputs.markdown_only != 'true'
        run: cargo test --workspace

      - name: Verify CLI init contract
        if: needs.changes.outputs.markdown_only != 'true' && runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'infer-verify'
          $sandbox = Join-Path $dir 'home'
          New-Item -ItemType Directory -Force -Path $sandbox | Out-Null
          $archive = Join-Path $dir 'infer-windows-amd64.tar.gz'
          $tag = (Get-Content .cli-version).Trim()
          Invoke-WebRequest -Uri "https://github.com/inference-gateway/cli/releases/download/$tag/infer-windows-amd64.tar.gz" -OutFile $archive
          tar -xzf $archive -C $dir
          if ($LASTEXITCODE -ne 0) { throw 'failed to extract infer.exe from the release tarball' }
          $bin = Join-Path $dir 'infer.exe'
          & $bin version
          $env:USERPROFILE = $sandbox
          $env:HOME = $sandbox
          $stale = & $bin init --userspace 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0) { throw 'infer init --userspace unexpectedly succeeded - the flag is back, the desktop needs updating again' }
          if ($stale -notmatch 'unknown flag') { throw "expected 'unknown flag' when passing --userspace, got: $stale" }
          & $bin init
          if ($LASTEXITCODE -ne 0) { throw 'infer init without flags failed' }
          if (-not (Test-Path (Join-Path $sandbox '.infer\config.yaml'))) { throw 'infer init did not create the userspace config.yaml' }
          Write-Host 'CLI init contract verified: bare infer init seeds the userspace config, --userspace is gone'

  cli-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: sigstore/cosign-installer@v4.1.3

      - name: Verify the tested CLI release against its signature
        env:
          CLI_RELEASE_IDENTITY: https://github.com/inference-gateway/cli/.github/workflows/release.yml@refs/heads/main
          GITHUB_ACTIONS_ISSUER: https://token.actions.githubusercontent.com
        run: |
          base="https://github.com/inference-gateway/cli/releases/download/$(cat .cli-version)"
          curl -fsSL -o "$RUNNER_TEMP/checksums.txt" "$base/checksums.txt"
          curl -fsSL -o "$RUNNER_TEMP/checksums.txt.sigstore.json" "$base/checksums.txt.sigstore.json"
          cosign verify-blob "$RUNNER_TEMP/checksums.txt" \
            --bundle "$RUNNER_TEMP/checksums.txt.sigstore.json" \
            --certificate-identity "$CLI_RELEASE_IDENTITY" \
            --certificate-oidc-issuer "$GITHUB_ACTIONS_ISSUER"
          diff "$RUNNER_TEMP/checksums.txt" .cli-checksums.txt

  markdown-lint:
    needs: changes
    if: needs.changes.outputs.markdown == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - name: List the changed markdown files
        id: files
        env:
          MARKDOWN_FILES: ${{ needs.changes.outputs.markdown_files }}
        run: |
          set -f
          printf 'files<<EOF\n' >> "$GITHUB_OUTPUT"
          for markdown_file in $MARKDOWN_FILES; do
            if [ -f "$markdown_file" ]; then
              printf '%s\n' "$markdown_file" >> "$GITHUB_OUTPUT"
            fi
          done
          printf 'EOF\n' >> "$GITHUB_OUTPUT"

      - name: Markdown-only pull request with no files left to lint
        if: steps.files.outputs.files == ''
        run: echo "Only deleted .md files remained - nothing to lint"

      - name: Lint the changed markdown files
        if: steps.files.outputs.files != ''
        uses: DavidAnson/markdownlint-cli2-action@v25.0.0
        with:
          globs: |
            ${{ steps.files.outputs.files }}
