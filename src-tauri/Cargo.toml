[package]
name = "inference-gateway-desktop"
version = "0.1.0"
description = "Inference Gateway Desktop Client"
authors = ["inference-gateway"]
edition = "2021"

[lib]
name = "inference_gateway_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
ureq = "3"
sha2 = "0.11"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
