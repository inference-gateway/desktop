# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  GREETING: Hello, world!

tasks:
  default:
    desc: Print a greeting message
    cmds:
      - echo "{{.GREETING}}"
    silent: true

  build:
    desc: Build the project
    dir: src-tauri
    cmds:
      - cargo build

  test:
    desc: Run all tests
    dir: src-tauri
    cmds:
      - cargo test

  clippy:
    desc: Lint and format check
    dir: src-tauri
    cmds:
      - cargo fmt --check
      - cargo clippy -- -D warnings

  check:
    desc: Typecheck (no codegen)
    dir: src-tauri
    cmds:
      - cargo check

  dev:
    desc: Start dev server with hot-reload
    dir: src-tauri
    cmds:
      - cargo tauri dev

  e2e:
    desc: Run macOS e2e tests (AX-driven, mock mode; see e2e/tests/)
    dir: e2e
    preconditions:
      - sh: '[ "$(uname)" = "Darwin" ]'
        msg: 'e2e harness is macOS-only (drives the app via the accessibility tree)'
    cmds:
      # debug profile on purpose: the pinned Rust 1.95 toolchain miscompiles
      # this crate in release mode on macOS (SIGSEGV in str::replace)
      - cargo run -- {{.CLI_ARGS}}
