# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  GREETING: Hello, world!

tasks:
  default:
    desc: Print a greeting message
    cmds:
      - echo "{{.GREETING}}"
    silent: true

  install:
    desc: Install frontend dependencies (Bun)
    cmds:
      - bun install
    status:
      - test -d node_modules

  web:
    desc: Build the React frontend into dist/ (embedded by the Rust build)
    deps:
      - install
    cmds:
      - bun run build

  build:
    desc: Build the project
    dir: backend
    deps:
      - web
    cmds:
      - cargo build

  test:
    desc: Run all tests
    dir: backend
    deps:
      - web
    cmds:
      - cargo test

  clippy:
    desc: Lint and format check
    dir: backend
    deps:
      - web
    cmds:
      - cargo fmt --check
      - cargo clippy -- -D warnings

  check:
    desc: Typecheck (no codegen)
    dir: backend
    deps:
      - web
    cmds:
      - cargo check

  dev:
    desc: Start the app (rebuilds the frontend via beforeDevCommand)
    deps:
      - install
    cmds:
      - cargo tauri dev

  e2e:
    desc: Run macOS e2e tests (AX-driven, mock mode; see e2e/tests/)
    dir: e2e
    deps:
      - web
    preconditions:
      - sh: '[ "$(uname)" = "Darwin" ]'
        msg: 'e2e harness is macOS-only (drives the app via the accessibility tree)'
    cmds:
      - cargo run -- {{.CLI_ARGS}}
